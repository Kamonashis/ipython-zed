name = "IPython Notebook"
grammar = "ipynb_notebook"
path_suffixes = ["ipynb"]
tab_size = 2
hard_tabs = false
autoclose_before = ",}]\""

brackets = [
  { start = "{", end = "}", close = true, newline = true, not_in = ["string"] },
  { start = "[", end = "]", close = true, newline = true, not_in = ["string"] },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
]
